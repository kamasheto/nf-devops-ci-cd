name: CI
on:
  push:
    branches: [develop]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install and Test
        run: npm ci && npm test
